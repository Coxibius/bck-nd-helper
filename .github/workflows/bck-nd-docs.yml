name: Deploy Documentation to GitHub Pages

# Builds the HTML portal with the packaged `bck-nd` CLI and deploys it to
# GitHub Pages. Triggered on pushes to main (and manually via workflow_dispatch).
# Feature branches are never deployed - preview locally with `bck-nd docs .`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bck-nd-hlpr
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel build

          if [ -f pyproject.toml ] && grep -q 'name = "bck-nd-hlpr"' pyproject.toml; then
            # This repo IS the tool. Wipe path-shadow leftovers, build a wheel
            # from src-layout only, then install THAT wheel (never a stale tree).
            rm -rf ./bck_nd_hlpr ./build ./dist ./*.egg-info ./src/*.egg-info
            test -f src/bck_nd_hlpr/cli/mcp_server.py
            test -f src/bck_nd_hlpr/cli/formatters.py
            python -m build --wheel
            python -m pip install --no-cache-dir --force-reinstall dist/bck_nd_hlpr-*.whl
          else
            python -m pip install --no-cache-dir --force-reinstall "bck-nd-hlpr>=2.0.2"
          fi

      - name: Assert installed package paths
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib.metadata import version, files
          from pathlib import Path

          ver = version("bck-nd-hlpr")
          print(f"installed version: {ver}")

          pkg_files = list(files("bck-nd-hlpr") or [])
          mcp = next(
              p for p in pkg_files
              if str(p).replace("\\", "/").endswith("cli/mcp_server.py")
          )
          mcp_path = Path(mcp.locate())
          text = mcp_path.read_text(encoding="utf-8")

          stale = "from bck_nd_hlpr.core.todo_hunter import scan_for_todos, get_todos_table_string"
          if stale in text:
              raise SystemExit(
                  f"PATH CONFUSION: stale mcp_server at {mcp_path}\n"
                  "get_todos_table_string must come from cli.formatters, not core.todo_hunter"
              )
          if "from bck_nd_hlpr.cli.formatters import" not in text:
              raise SystemExit(f"mcp_server missing formatters import: {mcp_path}")

          # Package must live under site-packages, never the checkout src/ tree
          resolved = str(mcp_path.resolve())
          if "/src/bck_nd_hlpr/" in resolved or "\\src\\bck_nd_hlpr\\" in resolved:
              raise SystemExit(f"PATH CONFUSION: imported checkout tree instead of installed package: {resolved}")

          print(f"mcp_server OK: {mcp_path}")
          PY

      - name: Smoke-test CLI entry points
        run: |
          set -euo pipefail
          command -v bck-nd
          bck-nd --help
          bck-nd docs --help

      - name: Generate documentation portal
        run: |
          set -euo pipefail
          rm -rf docs
          mkdir -p docs
          bck-nd docs . --output docs
          touch docs/.nojekyll

      - name: Assert docs artifact
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -s docs/index.html
          echo "docs/index.html size: $(wc -c < docs/index.html) bytes"
          ls -la docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
