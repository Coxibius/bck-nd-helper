name: Generate Documentation

on:
  push:
    branches:
      - main # Solo se publica oficialmente cuando se hace merge a main

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Backend Helper Scan
        run: |
          # Generar el portal HTML en la carpeta 'docs'
          bck-nd docs . --output docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs # Sube el contenido de 'docs' directamente a la raíz de gh-pages
