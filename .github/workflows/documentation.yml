name: Generate Documentation

on:
  push:
    branches:
      - '**'   # Run on every branch push
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Instalar bck-nd desde el repositorio actual para tener el comando disponible
          pip install .

      - name: Run Backend Helper Scan (generate HTML with embedded Mermaid)
        run: |
          # The Mermaid diagram generated by bck-nd is embedded and rendered automatically within the HTML
          bck-nd docs . -o docs

      - name: Generate Markdown Architecture
        run: |
          # Generate a Markdown version of the architecture (no PDF required)
          bck-nd scan . --format markdown > ARCHITECTURE.md || echo "bck-nd scan fallback"

      - name: Upload Docs Artifact (Test Branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: architecture-docs
          path: |
            docs/
            ARCHITECTURE.md
          retention-days: 7

      - name: Deploy to GitHub Pages (Branch Specific)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          destination_dir: ${{ github.ref_name }}
          keep_files: true
