name: QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out this revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install this checkout
        run: python -m pip install .

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run QA
        run: python scripts/run_qa.py --report-dir "${{ runner.temp }}/bck-nd-qa"

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/bck-nd-qa/qa.log
            ${{ runner.temp }}/bck-nd-qa/junit.xml
            ${{ runner.temp }}/bck-nd-qa/summary.json
          if-no-files-found: ignore
